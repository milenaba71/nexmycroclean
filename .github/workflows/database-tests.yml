name: Database migration regressions
on:
  pull_request:
    paths: ['sql/**', 'supabase/**', 'tests/**', 'scripts/**', 'package*.json', 'production-core.js', '.github/workflows/database-tests.yml']
  push:
    paths: ['sql/**', 'supabase/**', 'tests/**', 'scripts/**', 'package*.json', 'production-core.js', '.github/workflows/database-tests.yml']
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6839 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

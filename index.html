function heading(title,desc,action=''){return`<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function lotsView(){let rows=db.lots.flatMap(l=>l.rows);$('#app').innerHTML=heading('Il lavoro, sotto controllo.','Gestisci i lotti e segui ogni prodotto, dall’ingresso alla riconsegna.',`<button class="btn" onclick="newLot()">＋ Nuovo lotto</button>`)+`<div class="cards">${[['Lotti aperti',db.lots.filter(l=>summary(l)!=='Chiuso').length,'Da completare'],['Capi in entrata',rows.filter(r=>r.state==='Entrato').length,'In attesa di lavorazione'],['In lavorazione',rows.filter(r=>r.state==='In lavorazione').length,'Nel ciclo produttivo'],['Capi usciti',rows.filter(r=>r.state==='Uscito').length,'Riconsegne registrate']].map(x=>`<div class="card"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="panel"><div class="panelhead"><h2>Lotti di lavanderia</h2><span class="muted">${db.lots.length} lotti totali</span></div><div class="tools"><input class="search" placeholder="Cerca lotto o cliente…" value="${esc(query)}" oninput="query=this.value;lotTable()"><select onchange="status=this.value;lotTable()"><option value="">Tutti gli stati</option><option>Aperto</option><option>Uscita parziale</option><option>Chiuso</option></select><button class="btn secondary" onclick="exportLots()">↓ Esporta CSV</button></div><div class="scroll" id="lotTable"></div><div class="bottom">Apri un lotto per acquisire i codici e registrare i passaggi.</div></div><div class="notice">Database condiviso su Supabase. Per la scansione usa il lettore barcode o inserisci il codice; è disponibile anche una lettura simulata.</div>`;lotTable()}
function lotTable(){$('#lotTable').innerHTML=`<table><thead><tr><th>Lotto / ingresso</th><th>Cliente</th><th>Entrati totali</th><th>Da lavorare</th><th>In lavorazione</th><th>Usciti</th><th>Stato</th><th></th></tr></thead><tbody>${db.lots.filter(l=>(lotno(l)+' '+l.client).toLowerCase().includes(query.toLowerCase())&&(!status||summary(l)===status)).slice().reverse().map(l=>`<tr><td><b>${lotno(l)}</b><br><span class="muted">${l.date.split('-').reverse().join('/')} · ${l.colli} colli</span></td><td><b>${esc(l.client)}</b></td><td>${l.rows.length}</td><td>${l.rows.filter(r=>r.state==='Entrato').length}</td><td>${l.rows.filter(r=>r.state==='In lavorazione').length}</td><td>${l.rows.filter(r=>r.state==='Uscito').length}</td><td>${badge(summary(l))}</td><td><button class="link" onclick="openLot(${l.id})">Apri lotto →</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nessun lotto trovato</td></tr>'}</tbody></table>`}
function garments(){garmentPage=0;$('#app').innerHTML=heading('Anagrafica prodotti','Ogni capo ha un’identità. Proprietà, assegnazione e storico in un unico posto.',`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="importDialog()">↑ Importa</button><button class="btn secondary" onclick="exportDialog()">↓ Esporta</button><button class="btn" onclick="newGarment()">＋ Nuovo prodotto</button></div>`)+`<div class="panel"><div class="panelhead"><h2>Il tuo patrimonio tessile</h2><span class="muted">${db.garments.length} prodotti</span></div><div class="tools"><input class="search" placeholder="Cerca codice, nome, cliente o tipo…" oninput="query=this.value;garmentPage=0;garmentTable()"><select onchange="prop=this.value;garmentPage=0;garmentTable()"><option value="">Tutte le proprietà</option><option value="rent">Mycroclean · Noleggio</option><option value="client">Proprietà cliente</option><option value="unknown">Da definire</option></select></div><div class="scroll" id="garmentTable"></div><div class="bottom">Dati dal file prodotti caricato · Colore e proprietà mancanti sono indicati come “Da definire”.</div></div>`;garmentTable()}
function garmentTable(){$('#garmentTable').innerHTML=`<table><thead><tr><th>Codice / tag</th><th>Prodotto</th><th>Taglia</th><th>Colore</th><th>Proprietà / gestione</th><th>Cliente / utilizzatore</th><th>Lavaggi</th><th>Stato</th><th></th></tr></thead><tbody>${filteredGarments().slice(garmentPage*50,(garmentPage+1)*50).map(g=>`<tr><td class="code">${esc(g.id)}</td><td><b>${esc(g.type)}</b></td><td>${esc(g.size)}</td><td><span class="dot" style="background:${{Bianco:'#fff',Blu:'#3b647e',Verde:'#719b87'}[g.color]||'#ccc'}"></span>${esc(g.color)}</td><td><span class="badge ${g.rental?'rent':'client'}">${ownership(g)}</span></td><td>${esc(g.client)}<br><span class="muted">${esc(g.name)}</span></td><td>${g.wash} <span class="muted">/ ${g.max}</span></td><td>${badge(state(g.id))}</td><td><button class="link" onclick="showGarment('${g.id}')">Scheda →</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Nessun prodotto trovato</td></tr>'}</tbody></table><div class="tools"><button class="btn secondary" ${garmentPage===0?'disabled':''} onclick="garmentPage--;garmentTable()">← Precedenti</button><span style="padding:12px">Pagina ${garmentPage+1} / ${Math.max(1,Math.ceil(filteredGarments().length/50))} · ${filteredGarments().length} prodotti</span><button class="btn secondary" ${(garmentPage+1)*50>=filteredGarments().length?'disabled':''} onclick="garmentPage++;garmentTable()">Successivi →</button></div>`}
let stage='Entrata';function openLot(id){current=db.lots.find(l=>l.id===id);stage='Entrata';render()}function detail(){let l=current;$('#app').innerHTML=heading(lotno(l),esc(l.client)+' · Riconsegna prevista '+l.due.split('-').reverse().join('/'),`<button class="btn secondary" onclick="current=null;render()">← Tutti i lotti</button>`)+`<div class="panel"><div class="steps">${['Entrata','Lavorazione','Uscita'].map((s,i)=>`<button class="step ${stage===s?'on':''}" onclick="stage='${s}';detail()">0${i+1} &nbsp; ${s}</button>`).join('')}</div>${stage==='Entrata'?entryProcessing():''}<div class="scan"><b>${stage==='Entrata'?'Acquisisci un prodotto':stage==='Lavorazione'?'Avvia il passaggio in lavorazione':'Registra un’uscita'}</b><input id="scan" aria-label="Codice prodotto" placeholder="Scansiona o digita il codice (es. MC00001)" onkeydown="if(event.key==='Enter')scanCode()"><button class="btn" onclick="scanCode()">Registra</button><button class="btn secondary" onclick="simulate()">Simula lettura</button></div><div class="hint">${stage==='Entrata'?'La simulazione sceglie un capo disponibile dello stesso cliente. Pallino rosso = Scarto o limite lavaggi superato.':stage==='Lavorazione'?'La lavorazione è stata scelta in entrata. Avvia i capi e conferma il completamento; i lavaggi aumentano solo per i trattamenti che li prevedono.':'Puoi riconsegnare solo i capi con lavorazione completata e senza riparazioni aperte.'}</div><div class="tools"><button class="btn secondary" onclick="bulk()">${stage==='Entrata'?'Seleziona tutti':stage==='Lavorazione'?'Avvia selezionati':'Registra uscita selezionati'}</button>${stage==='Lavorazione'?'<button class="btn" onclick="completeWash()">Conferma lavorazione completata</button>':''}${stage==='Uscita'?'<button class="btn secondary" onclick="printLot()">Stampa riepilogo uscita</button>':''}<span style="margin:auto 0 auto auto" class="muted">${l.rows.length} entrati · ${l.rows.filter(r=>r.state==='In lavorazione').length} in lavorazione · ${l.rows.filter(r=>r.state==='Uscito').length} usciti</span></div><div class="scroll"><table><thead><tr><th><input type="checkbox" aria-label="Seleziona tutti" onchange="document.querySelectorAll('.pick').forEach(x=>x.checked=this.checked)"></th><th>Scarto</th><th>Codice / utilizzatore</th><th>Tipo</th><th>Taglia / colore</th><th>Gestione</th><th>Lavorazione prevista</th><th>Stato</th><th>Riparazione</th><th>Completamento</th></tr></thead><tbody>${l.rows.map(r=>{let g=db.garments.find(g=>g.id===r.code);return`<tr><td><input class="pick" type="checkbox" value="${g.id}" aria-label="Seleziona ${g.id}"></td>${lotDiscardCell(g,r)}<td><b class="code">${g.id}</b><br><span class="muted">${esc(g.name)}</span></td><td>${g.type}</td><td>${g.size} · ${g.color}</td><td><span class="badge ${g.rental?'rent':'client'}">${ownership(g)}</span></td><td>${esc(r.processingName||'Da assegnare')}</td><td>${badge(r.state)}</td><td><label><input type="checkbox" ${r.repair?'checked':''} ${r.state==='Uscito'?'disabled':''} onchange="repair('${g.id}',this.checked)"> Da riparare</label><br><label><input type="checkbox" ${r.relabel?'checked':''} ${r.state==='Uscito'?'disabled':''} onchange="lotFlag('${g.id}','relabel',this.checked)"> Da etichettare</label><br><label><input type="checkbox" ${r.verify?'checked':''} ${r.state==='Uscito'?'disabled':''} onchange="lotFlag('${g.id}','verify',this.checked)"> Da verificare</label></td><td>${r.completed||r.washed||r.state==='Uscito'?'✓ Completato':'Da completare'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Lotto vuoto. Registra il primo prodotto.</td></tr>'}</tbody></table></div></div><div class="panel"><div class="panelhead"><h2>Registro del lotto</h2><span class="muted">Operatore: ${esc(cloudUser?.name||'')}</span></div>${l.events.slice().reverse().slice(0,12).map(e=>`<div class="bottom"><b>${esc(e.action)}</b> · ${esc(e.code)}<span style="float:right">${esc(e.time)} · ${esc(e.actor||'')}</span></div>`).join('')||'<div class="bottom">Le nuo function log(action,code){let e={action,code,time:new Date().toLocaleString('it-IT',{timeZone:'Europe/Rome'}),actor:cloudUser?.name||'',actorEmail:cloudUser?.email||''};current.events.push(e);db.garments.find(g=>g.id===code)?.history.push({...e,lot:lotno(current)});save()}
function process(code){let g=db.garments.find(g=>g.id===code);if(!g)return'Codice sconosciuto: crea prima l’prodotto in anagrafica.';let r=current.rows.find(r=>r.code===code);if(stage==='Entrata'){let chosen=selectedProcessing();if(!chosen)return'Seleziona prima il tipo di lavorazione in entrata.';if(g.client!==current.client)return'Il capo appartiene a un altro cliente.';if(r)return'Codice già presente in questo lotto: nessun duplicato.';if(db.lots.some(l=>l.rows.some(x=>x.code===code&&x.state!=='Uscito')))return'Il capo è già presente in un lotto aperto.';current.rows.push({code,state:'Entrato',discard:productIsDiscard(g),repair:false,washed:false,processingId:chosen.id,processingName:chosen.name,washRequired:chosen.wash});log('Entrata · '+chosen.name,code);return null}if(!r)return'Capo non presente nel lotto.';if(stage==='Lavorazione'){if(r.state!=='Entrato')return'Il capo non è in attesa di lavorazione.';if(!r.processingId)return'Assegna prima la lavorazione in entrata.';r.state='In lavorazione';log('Avvio lavorazione',code);return null}if(r.state!=='In lavorazione'||!r.completed&&!r.washed)return'Completa prima la lavorazione del capo.';if(r.repair||r.relabel||r.verify)return'Capo bloccato: completa riparazione, etichetta o verifica ancora aperte.';r.state='Uscito';log('Uscita',code);return null}
function scanCode(){let c=$('#scan').value.trim().toUpperCase();if(!c)return notify('Inserisci un codice.');let err=process(c);detail();notify(err||'Passaggio registrato: '+c);$('#scan').focus()}function simulate(){let code;if(stage==='Entrata')code=db.garments.find(g=>g.client===current.client&&!current.rows.some(r=>r.code===g.id)&&!db.lots.some(l=>l.rows.some(r=>r.code===g.id&&r.state!=='Uscito')))?.id;else code=current.rows.find(r=>stage==='Lavorazione'?r.state==='Entrato':r.state==='In lavorazione'&&(r.completed||r.washed)&&!r.repair&&!r.relabel&&!r.verify)?.code;if(!code)return notify('Nessun capo disponibile per questo passaggio.');let err=process(code);detail();notify(err||'Lettura simulata registrata: '+code)}function selected(){return [...document.querySelectorAll('.pick:checked')].map(x=>x.value)}function bulk(){if(stage==='Entrata'){document.querySelectorAll('.pick').forEach(x=>x.checked=true);return}let a=selected();if(!a.length)return notify('Seleziona almeno un prodotto.');let n=0,errors=[];a.forEach(c=>{let e=process(c);if(e)errors.push(e);else n++});detail();notify(n+' passaggi registrati.'+(errors.length?' '+errors.length+' capi non idonei: '+errors[0]:''))}function completeWash(){let a=selected(),n=0;if(!a.length)return notify('Seleziona i capi del ciclo completato.');a.forEach(c=>{let r=current.rows.find(r=>r.code===c);if(r.state==='In lavorazione'&&!r.completed&&!r.washed){r.completed=true;if(r.washRequired!==false){r.washed=true;db.garments.find(g=>g.id===c).wash++}log('Lavorazione completata · '+(r.processingName||''),c);n++}});detail();notify(n+' lavorazioni completate. Lavaggi aggiornati solo dove previsti.')}function repair(c,v){let r=current.rows.find(r=>r.code===c);r.repair=v;log(v?'Richiesta riparazione':'Riparazione risolta',c);detail()}
function options(a){return a.map(v=>`<option>${esc(v)}</option>`).join('')}function show(html){$('#modal').innerHTML=html;$('#modal').showModal()}function newLot(){show(`<h2>Apri un nuovo lotto</h2><p>Numero progressivo assegnato automaticamente al salvataggio.</p><form onsubmit="createLot(event)"><label class="wide">Cliente<select name="client">${options(clients)}</select></label><label>Numero colli<input name="colli" type="number" min="1" value="1" required></label><label>Riconsegna prevista<input name="due" type="date" value="2026-10-29" required></label><div class="wide" style="text-align:right"><button type="button" class="btn secondary" onclick="document.querySelector('dialog').close()">Annulla</button> <button class="btn">Crea lotto</button></div></form>`)}function createLot(e){e.preventDefault();let f=new FormData(e.target);let l={id:db.next++,client:f.get('client'),colli:+f.get('colli'),due:f.get('due'),date:new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'}),rows:[],events:[]};db.lots.push(l);save();$('#modal').close();openLot(l.id);notify('Creato '+lotno(l))}
function newGarment(){show(`<h2>Nuovo prodotto</h2><form onsubmit="createGarment(event)"><label>Barcode / tag univoco<input name="id" required placeholder="MC00025" pattern="[A-Za-z0-9_-]+"></label><label>Tipo<select name="type">${options(types)}</select></label><label>Taglia<select name="size">${options(['XS','S','M','L','XL','XXL'])}</select></label><label>Colore<select name="color">${options(['Da definire',...colors])}</select></label><label>Cliente assegnatario<select name="client">${options(clients)}</select></label><label>Proprietà e gestione<select name="rental"><option value="unknown">Da definire</option><option value="yes">Mycroclean · Noleggio</option><option value="no">Proprietà cliente</option></select></label><label class="wide">Nome utilizzatore<input name="name" placeholder="Facoltativo"></label><div class="wide" style="text-align:right"><button type="button" class="btn secondary" onclick="document.querySelector('dialog').close()">Annulla</button> <button class="btn">Salva prodotto</button></div></form>`)}function createGarment(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.id=f.id.toUpperCase();if(db.garments.some(g=>g.id===f.id))return notify('Codice già presente.');db.garments.push({...f,rental:f.rental==='unknown'?null:f.rental==='yes',wash:0,max:80,dept:'Produzione',history:[]});save();$('#modal').close();garments();notify('Prodotto creato. Ora puoi registrarlo in entrata.')}
function showGarment(c){let g=db.garments.find(g=>g.id===c);show(`<h2>${esc(g.type)} · ${g.id}</h2><p>${esc(g.client)} · ${esc(g.name)}</p><div class="tools">${badge(state(c))}<span>${g.size} · ${g.color} · ${ownership(g)}</span></div><p>Lavaggi effettuati: <b>${g.wash} / ${g.max}</b></p><div class="tools"><button class="btn secondary" onclick="editMeta('${g.id}')">Modifica taglia, colore e proprietà</button></div><p>Reparto: ${esc(g.dept||'—')} · Armadio: ${esc(g.raw?.ARMADIO||'—')} · Posizione: ${esc(g.raw?.POSIZIONE||'—')}</p><h2 style="margin:25px 0 12px">Storico del capo</h2><div style="max-height:300px;overflow:auto">${g.history.slice().reverse().map(h=>`<div class="bottom">${esc(h.action)} · ${h.lot}<br>${esc(h.time)} · Milena Baroni</div>`).join('')||'<p>Nessuna nuova operazione nella demo.</p>'}</div><button class="btn secondary" style="margin-top:20px" onclick="document.querySelector('dialog').close()">Chiudi</button>`)}
function clientView(){$('#app').innerHTML=heading('Clienti','Dotazioni assegnate e proprietà degli prodotti.')+`<div class="cards">${clients.map(c=>`<div class="card"><h2>${c}</h2><strong>${db.garments.filter(g=>g.client===c).length}</strong><p>prodotti assegnati</p><small>${db.garments.filter(g=>g.client===c&&g.rental).length} a noleggio · ${db.garments.filter(g=>g.client===c&&g.rental===false).length} proprietà cliente</small></div>`).join('')}</div>`}function activity(){$('#app').innerHTML=heading('Registro attività','Tracciabilità delle operazioni registrate in questa demo.')+`<div class="panel">${db.lots.flatMap(l=>l.events.map(e=>({...e,lot:lotno(l)}))).reverse().map(e=>`<div class="panelhead"><div><b>${esc(e.action)}</b><p>${e.code} · ${e.lot}</p></div><span class="muted">${esc(e.time)} · ${esc(e.actor||'')}</span></div>`).join('')||'<div class="empty">Registra un passaggio in un lotto per iniziare.</div>'}</div>`}function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportLots(){download('\ufeffLotto;Cliente;Entrati;Usciti;Stato\n'+db.lots.map(l=>[lotno(l),l.client,l.rows.length,l.rows.filter(r=>r.state==='Uscito').length,summary(l)].join(';')).join('\n'),'lotti-demo.csv','text/csv;charset=utf-8')}function printLot(){let l=current;show(`<h2>Riepilogo uscite · ${lotno(l)}</h2><p>${esc(l.client)} · ${l.rows.filter(r=>r.state==='Uscito').length} capi usciti</p><div class="scroll"><table><tr><th>Codice</th><th>Tipo</th><th>Taglia</th><th>Colore</th></tr>${l.rows.filter(r=>r.state==='Uscito').map(r=>{let g=db.garments.find(g=>g.id===r.code);return`<tr><td>${g.id}</td><td>${g.type}</td><td>${g.size}</td><td>${g.color}</td></tr>`}).join('')}</table></div><p>Riepilogo dimostrativo, non DDT fiscale.</p><button class="btn" onclick="window.print()">Stampa</button> <button class="btn secondary" onclick="document.querySelector('dialog').close()">Chiudi</button>`)}function resetDemo(){show(`<h2>Ripristina i dati di esempio</h2><p>Le modifiche effettuate in questa demo verranno eliminate.</p><div class="tools"><button class="btn" onclick="db=seed();save();document.querySelector('dialog').close();go('Lotti')">Ripristina demo</button><button class="btn secondary" onclick="document.querySelector('dialog').close()">Annulla</button></div>`)}
